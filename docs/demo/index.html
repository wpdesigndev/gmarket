<!-- CSS real del tema (copia de assets/css/main.css) -->
<link rel="stylesheet" href="gmarket.css">
<style>
/* Solo lo propio de la demo: barra de aviso, imágenes de ejemplo, portada y avisos */
.mk-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 9px var(--gmk-gutter); background: #07152a; color: #c9d6e8; font-size: 13.5px; }
.mk-bar a { color: #fff; font-weight: 700; }
.mk-bar .mk-dl { padding: 6px 14px; border-radius: 999px; background: var(--gmk-yellow); color: var(--gmk-blue-deep); text-decoration: none; }
.mk-bar .mk-dl:hover { background: var(--gmk-yellow-dark); color: var(--gmk-blue-deep); }
@media (max-width: 640px) { .mk-bar span { flex: 1 1 100%; order: 3; font-size: 12.5px; } }

.mk-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; color: var(--gmk-blue-deep); white-space: nowrap; }
.mk-logo:hover { text-decoration: none; color: var(--gmk-blue-deep); }
.mk-logo i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9px; background: linear-gradient(135deg, var(--gmk-blue-light), var(--gmk-green)); color: #fff; font-style: normal; font-size: 22px; }
@media (max-width: 767px) { .mk-logo span { display: none; } .mk-logo i { width: 36px; height: 36px; font-size: 20px; } }
.gmk-footer .mk-logo { color: #fff; }

/* Imágenes de producto de ejemplo */
.mk-img { font-style: normal; display: grid; place-items: center; width: 100%; aspect-ratio: 1; border-radius: 6px; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-size: clamp(40px, 6vw, 72px); line-height: 1; user-select: none; }
.mk-c1 { background: #eef3fb; } .mk-c2 { background: #f3eff9; } .mk-c3 { background: #fbf0ef; } .mk-c4 { background: #f9f5ec; } .mk-c5 { background: #edf6ef; }
.woocommerce ul.products li.product .mk-img { margin: 0 0 12px; }
.gmk-tile__grid .mk-img { font-size: clamp(36px, 4.4vw, 60px); }
.gmk-row__img .mk-img { font-size: 56px; background: transparent; }
.gmk-cats__img .mk-img { font-size: 52px; background: transparent; }
.gmk-suggest__item .mk-img { width: 46px; height: 46px; font-size: 28px; flex: none; }
.gmk-product-page div.images .mk-img { font-size: clamp(110px, 20vw, 220px); border-radius: 10px; }
.mk-cart-img { width: 64px; font-size: 34px; }

.mk-stars { display: inline-block; font-size: 14px; letter-spacing: 1px; background: linear-gradient(90deg, #f5a623 calc(var(--r) / 5 * 100%), #cfd6de 0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mk-rating { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 13px; color: var(--gmk-muted); }
.woocommerce ul.products li.product .woocommerce-loop-product__title { font-family: inherit; }

/* Portada de ejemplo (en una tienda real se hace con Elementor o con bloques) */
.mk-hero { color: #fff; background: radial-gradient(120% 140% at 85% 100%, #1d7a3a 0%, rgba(29,122,58,0) 45%), linear-gradient(115deg, #0b1e3a 0%, #0a3a7a 55%, #0b4c9a 75%, #145c6a 100%); padding: 48px 0 140px; }
.mk-hero__in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 48px; align-items: center; }
.mk-hero h1 { color: #fff; font-size: clamp(30px, 4vw, 44px); line-height: 1.17; font-weight: 700; margin: 18px 0 14px; letter-spacing: -.3px; }
.mk-hero p { font-size: 17px; line-height: 1.55; color: #e6edf7; margin: 0 0 22px; max-width: 610px; }
.mk-hero .gmk-online { font-size: 13px; color: #fff; }
.mk-btns { display: flex; flex-wrap: wrap; gap: 12px; }
.mk-btn { display: inline-block; padding: 14px 24px; border-radius: 999px; font-weight: 700; font-size: 15px; }
.mk-btn:hover { text-decoration: none; filter: brightness(.95); }
.mk-btn--y { background: var(--gmk-yellow); color: var(--gmk-ink); }
.mk-btn--y:hover { color: var(--gmk-ink); }
.mk-btn--g { background: rgba(255,255,255,.15); color: #fff; }
.mk-btn--g:hover { color: #fff; }
.mk-easy { background: #fff; color: var(--gmk-text); border-radius: 14px; padding: 24px 26px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.mk-easy h3 { color: var(--gmk-blue); font-size: 20px; margin: 0 0 14px; }
.mk-easy ol { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 2.05; }
.mk-easy small { display: block; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gmk-line); color: var(--gmk-muted); font-size: 12.5px; }
.mk-home { display: grid; gap: 22px; margin-top: -118px; padding-bottom: 48px; }
.mk-home h2.mk-h { margin: 6px 0 -6px; font-size: 21px; }
@media (max-width: 900px) { .mk-hero__in { grid-template-columns: minmax(0, 1fr); } .mk-easy { display: none; } .mk-hero { padding-bottom: 130px; } }

/* Carrito */
.mk-cart { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.mk-cart table { width: 100%; border-collapse: collapse; }
.mk-cart th, .mk-cart td { padding: 12px 10px; border-bottom: 1px solid var(--gmk-line); text-align: left; vertical-align: middle; }
.mk-cart th { font-size: 13px; color: var(--gmk-muted); font-weight: 600; }
.mk-cart td a.mk-name { color: var(--gmk-ink); font-weight: 600; }
.mk-cart .qty { width: 64px; height: 38px; padding: 0 8px; border: 1px solid #c3ccd6; border-radius: 8px; font: inherit; }
.mk-rm { border: 0; background: none; color: var(--gmk-muted); font-size: 20px; cursor: pointer; line-height: 1; }
.mk-rm:hover { color: var(--gmk-red); }
.mk-totals { padding: 20px; border: 1px solid var(--gmk-line); border-radius: 10px; }
.mk-totals h2 { font-size: 1.2rem; }
.mk-totals p { display: flex; justify-content: space-between; margin: 0 0 10px; }
.mk-totals p.mk-sum { padding-top: 10px; border-top: 1px solid var(--gmk-line); font-size: 18px; font-weight: 700; color: var(--gmk-ink); }
.mk-totals .gmk-btn { width: 100%; margin-top: 8px; background: var(--gmk-yellow); color: var(--gmk-ink) !important; font-size: 16px; }
@media (max-width: 900px) { .mk-cart { grid-template-columns: minmax(0, 1fr); } .mk-cart .mk-hide-sm { display: none; } }

/* Ficha: pestañas, relacionados y valoraciones de ejemplo (en la tienda real lo pone la hoja de estilos de WooCommerce) */
.woocommerce div.product .woocommerce-tabs ul.tabs { display: flex; flex-wrap: wrap; list-style: none; }
.woocommerce div.product .woocommerce-tabs ul.tabs li a { display: inline-block; }
.woocommerce .related ul.products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1199px) { .woocommerce .related ul.products { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 767px) { .woocommerce .related ul.products { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mk-review { padding: 14px 0; border-bottom: 1px solid var(--gmk-line); }
.mk-review strong { color: var(--gmk-ink); }
.woocommerce div.product p.stock.out-of-stock { color: var(--gmk-red); font-weight: 700; font-size: 17px; }
.woocommerce div.product form.cart .button:disabled { background: #c3ccd6; cursor: not-allowed; }

/* Aviso flotante */
.mk-toast { position: fixed; left: 50%; bottom: 24px; z-index: 300; display: flex; align-items: center; gap: 14px; max-width: min(560px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 12px; background: var(--gmk-blue-deep); color: #fff; font-size: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.3); transform: translate(-50%, 20px); opacity: 0; visibility: hidden; transition: transform .2s, opacity .2s, visibility .2s; }
.mk-toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
.mk-toast a { color: var(--gmk-yellow); font-weight: 700; white-space: nowrap; }
.woocommerce .woocommerce-info { padding: 14px 18px; border-top: 3px solid var(--gmk-green); }
</style>

		if (h === 'arriba') { return; }
		if (h === '/demo') { toast('<span>' + t('linkDemo') + '</span>'); history.replaceState(null, '', lastPath ? '#' + lastPath : '#/'); return; }
		var parts = (h || '/').split('?'), path = parts[0] || '/', q = new URLSearchParams(parts[1] || '');
		document.body.classList.remove('gmk-filters-open', 'gmk-lock');
		document.querySelector('.gmk-suggest').hidden = true;
		if (path === '/tienda') { shop(q); }
		else if (path.indexOf('/p/') === 0) { product(path.slice(3)); }
		else if (path === '/carrito') { cartPage(); }
		else if (path === '/cuenta') { account(); }
		else { home(); }
		if (path !== lastPath.split('?')[0] || path !== '/tienda') { window.scrollTo(0, 0); }
		lastPath = h || '/';
		markNav();
	}
	window.addEventListener('hashchange', route);

	/* ---------- Idioma ---------- */
	function setLang(l, silent) {
		lang = l === 'en' ? 'en' : 'es';
		try { localStorage.setItem('gmk-lang', lang); } catch (e) {}
		applyStatic();
		window.dispatchEvent(new Event('resize')); // la barra recalcula el menú «Más»
		if (!silent) { route(); }
	}
	document.querySelectorAll('.gmk-lang a').forEach(function (a) {
		a.addEventListener('click', function (e) { e.preventDefault(); setLang(a.getAttribute('data-lang')); });
	});

	/* ---------- Clics generales: añadir, guardar, volver arriba ---------- */
	document.addEventListener('click', function (e) {
		var add = e.target.closest('[data-add]');
		if (add) { e.preventDefault(); addToCart(add.getAttribute('data-add')); return; }
		var w = e.target.closest('[data-wish]');
		if (w) {
			e.preventDefault();
			var id = w.getAttribute('data-wish');
			wish[id] = !wish[id];
			w.innerHTML = heart(wish[id]) + '<span class="yith-wcwl-add-to-wishlist-button__label">' + (wish[id] ? t('saved') : t('save')) + '</span>';
			return;
		}
		var top = e.target.closest('a[href="#arriba"]');
		if (top) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
	});

	/* ---------- Búsqueda en vivo (en la tienda real la responde WordPress) ---------- */
	var form = document.querySelector('.gmk-search'), input = form.querySelector('.gmk-search__input'), sel = form.querySelector('.gmk-search__cat'), box = form.querySelector('.gmk-suggest'), active = -1, timer;
	function suggest() {
		var q = input.value.trim();
		if (q.length < 2) { box.hidden = true; return; }
		var s = norm(q), html = '';
		CATS.filter(function (c) { return norm(c[lang]).indexOf(s) > -1; }).forEach(function (c) {
			html += '<a class="gmk-suggest__cat" href="#/tienda?cat=' + c.id + '">' + t('searchCat') + ' <strong>' + c[lang] + '</strong></a>';
		});
		P.filter(function (p) { return (!sel.value || p.cat === sel.value) && norm(name(p)).indexOf(s) > -1; }).slice(0, 6).forEach(function (p) {
			html += '<a class="gmk-suggest__item" href="#/p/' + p.id + '">' + img(p) + '<span><strong>' + esc(name(p)) + '</strong><small>' + catOf(p.cat)[lang] + '</small></span><em>' + money(cur(p)) + '</em></a>';
		});
		box.innerHTML = html ? html + '<button type="submit" class="gmk-suggest__all">' + t('searchSeeAll') + ' “' + esc(q) + '”</button>' : '<p class="gmk-suggest__none">' + t('searchNone') + '</p>';
		box.hidden = false;
		active = -1;
	}
	input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(suggest, 150); });
	input.addEventListener('focus', function () { if (input.value.trim().length > 1) { suggest(); } });
	sel.addEventListener('change', suggest);
	input.addEventListener('keydown', function (e) {
		var items = box.querySelectorAll('a');
		if (box.hidden || !items.length) { return; }
		if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
			e.preventDefault();
			active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
			items.forEach(function (a, i) { a.classList.toggle('is-active', i === active); });
		} else if (e.key === 'Enter' && active > -1) {
			e.preventDefault();
			location.hash = items[active].getAttribute('href');
			input.blur();
		}
	});
	box.addEventListener('click', function (e) { if (e.target.closest('a')) { box.hidden = true; input.blur(); } });
	document.addEventListener('click', function (e) { if (!form.contains(e.target)) { box.hidden = true; } });
	form.addEventListener('submit', function (e) {
		e.preventDefault();
		var q = input.value.trim(), p = new URLSearchParams();
		if (q) { p.set('s', q); }
		if (sel.value) { p.set('cat', sel.value); }
		box.hidden = true;
		input.blur();
		location.hash = '#/tienda' + (p.toString() ? '?' + p : '');
	});

	/* ---------- Inicio ---------- */
	document.getElementById('year').textContent = new Date().getFullYear();
	var saved = (function () { try { return localStorage.getItem('gmk-lang'); } catch (e) { return null; } })();
	var nav = (navigator.language || '').toLowerCase();
	lang = location.hash === '#en' ? 'en' : location.hash === '#es' ? 'es' : saved ? saved : (nav !== '' && nav.indexOf('es') !== 0 ? 'en' : 'es');
	applyStatic();
	route();
})();
</script>
